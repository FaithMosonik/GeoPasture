name: geopasture
description: "Offline-first livestock behavioural monitoring app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── Local database (Drift ORM over SQLite) ───────────────────────────
  drift: ^2.14.0
  drift_flutter: ^0.1.0          # Flutter-specific Drift helpers
  sqlite3_flutter_libs: ^0.5.0   # Bundles SQLite native libs for Android/iOS
  path_provider: ^2.1.0          # Locates the documents directory for the DB file
  path: ^1.9.0

  # ── Firebase ─────────────────────────────────────────────────────────
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.1.3
  firebase_storage: ^12.1.3

  # ── TFLite inference ─────────────────────────────────────────────────
  # tflite_flutter re-added once teammate pushes model file + SDK-compatible version confirmed
  # tflite_flutter: ^0.10.4

  # ── Accelerometer sensor ─────────────────────────────────────────────
  sensors_plus: ^4.0.0

  # ── Background execution ─────────────────────────────────────────────
  flutter_foreground_task: ^6.0.0  # Keeps inference service alive in background
  workmanager: ^0.9.0              # Schedules periodic alert logic checks

  # ── Offline / connectivity ───────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Notifications ────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── Maps ─────────────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── State management ─────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Charts ───────────────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── Utilities ────────────────────────────────────────────────────────
  uuid: ^4.4.2
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  get_it: ^7.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.14.0             # Generates drift query code (app_database.g.dart)
  build_runner: ^2.4.0           # Runs the drift code generator

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/icons/